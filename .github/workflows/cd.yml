name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: manojpvs18/cats-dogs/cats-dogs-api

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cats-dogs-cluster

      - name: Create image pull secret for GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password="${GHCR_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute image tag into manifests
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}|g" k8s/deployment.yaml
          cat k8s/deployment.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/cats-dogs-api --timeout=180s

      - name: Port-forward service
        run: |
          kubectl port-forward svc/cats-dogs-api-service 8000:80 >/tmp/cats-dogs-portforward.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh http://localhost:8000

      - name: Fail pipeline on smoke test failure
        if: failure()
        run: |
          echo "Smoke tests failed — rolling deployment back."
          kubectl rollout undo deployment/cats-dogs-api || true
          exit 1
