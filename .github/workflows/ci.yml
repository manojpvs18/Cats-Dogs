name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cats-dogs-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create placeholder model (for API import/tests only)
        run: |
          python -c "
          import torch, os
          from src.models.model import build_model, CLASS_NAMES
          os.makedirs('artifacts', exist_ok=True)
          m = build_model()
          torch.save({'state_dict': m.state_dict(), 'class_names': CLASS_NAMES}, 'artifacts/model.pt')
          "

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache
          if-no-files-found: ignore

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate placeholder model for image build
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "
          import torch, os, sys
          sys.path.insert(0, '.')
          from src.models.model import build_model, CLASS_NAMES
          os.makedirs('artifacts', exist_ok=True)
          m = build_model()
          torch.save({'state_dict': m.state_dict(), 'class_names': CLASS_NAMES}, 'artifacts/model.pt')
          "

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
